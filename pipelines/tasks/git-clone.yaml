apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
  labels:
    app.kubernetes.io/part-of: devspaces-vibe-coding
spec:
  description: >
    Clone a Git repository into a shared workspace.
  params:
    - name: url
      type: string
      description: Git repository URL to clone.
    - name: revision
      type: string
      default: main
      description: Branch, tag, or commit SHA to check out.
    - name: subdirectory
      type: string
      default: ""
      description: Subdirectory inside the workspace to clone into.
    - name: deleteExisting
      type: string
      default: "true"
      description: Remove the destination directory before cloning if it exists.
  workspaces:
    - name: output
      description: Workspace where the repository will be cloned.
  results:
    - name: commit
      description: The precise commit SHA that was checked out.
    - name: url
      description: The repository URL that was cloned.
  steps:
    - name: clone
      image: registry.redhat.io/openshift-pipelines/pipelines-git-init-rhel8:v1.17.1
      env:
        - name: PARAM_URL
          value: $(params.url)
        - name: PARAM_REVISION
          value: $(params.revision)
        - name: PARAM_SUBDIRECTORY
          value: $(params.subdirectory)
        - name: PARAM_DELETE_EXISTING
          value: $(params.deleteExisting)
        - name: WORKSPACE_OUTPUT_PATH
          value: $(workspaces.output.path)
      securityContext:
        runAsNonRoot: true
      script: |
        #!/usr/bin/env sh
        set -eu

        CHECKOUT_DIR="${WORKSPACE_OUTPUT_PATH}/${PARAM_SUBDIRECTORY}"

        if [ "${PARAM_DELETE_EXISTING}" = "true" ] && [ -d "${CHECKOUT_DIR}" ]; then
          rm -rf "${CHECKOUT_DIR}"
        fi

        git clone "${PARAM_URL}" "${CHECKOUT_DIR}"
        cd "${CHECKOUT_DIR}"
        git checkout "${PARAM_REVISION}"

        RESULT_SHA=$(git rev-parse HEAD)
        echo -n "${RESULT_SHA}" > "$(results.commit.path)"
        echo -n "${PARAM_URL}" > "$(results.url.path)"

        echo "Cloned ${PARAM_URL} @ ${RESULT_SHA}"
